{% extends "auctions/layout.html" %}

{% block body %}
    <h2>Categories</h2>

        <ul>
        {% for category in categories %}
            <li>
                <a href="{% url 'category' category.id %}">
                    {{ category.name }}
                </a>
            </li>
        {% empty %}
            <li>Es sind noch keine Kategorien vorhanden.</li>
        {% endfor %}
    </ul>

{% endblock %}
